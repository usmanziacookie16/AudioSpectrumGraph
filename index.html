<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mic Linear Volume Indicator</title>
  <style>
    body {
      background: #121212;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .test-section {
      background: #1f2a3a;
      padding: 1rem;
      border-radius: 10px;
      margin: 1rem auto;
      width: 90%;
      max-width: 500px;
    }
    canvas {
      width: 100%;
      height: 20px;
      background: #333;
      border-radius: 10px;
      margin-top: 1rem;
    }
    button {
      margin-top: 1rem;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
    }
    .status {
      margin-top: 1rem;
    }
    .working { color: #4CAF50; }
    .not-working { color: #FF6347; }
  </style>
</head>
<body>

  <div class="test-section">
    <h2>Microphone Test</h2>
    <canvas id="micCanvas" width="400" height="20"></canvas>
    <button id="testMicBtn">Start Mic Test</button>
    <div class="status">Mic Status: <span id="micStatus" class="not-working">Not connected</span></div>
  </div>

  <script>
    let audioContext, micSource, micAnalyser, micDataArray, micGain;
    let micRunning = false;

    const micCanvas = document.getElementById('micCanvas');
    const micCtx = micCanvas.getContext('2d');
    const micStatus = document.getElementById('micStatus');
    const testMicBtn = document.getElementById('testMicBtn');

    testMicBtn.addEventListener('click', async () => {
      if (micRunning) return;
      micRunning = true;

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        micSource = audioContext.createMediaStreamSource(stream);
        micAnalyser = audioContext.createAnalyser();
        micAnalyser.fftSize = 512;
        micDataArray = new Uint8Array(micAnalyser.fftSize);

        micGain = audioContext.createGain();
        micGain.gain.value = 1;

        micSource.connect(micGain);
        micGain.connect(micAnalyser);

        micStatus.textContent = 'Working';
        micStatus.className = 'working';

        function getColor(normalized) {
          if (normalized < 0.3) {
            return '#00ff00'; // green
          } else if (normalized < 0.6) {
            return '#ffff00'; // yellow
          } else {
            return '#ff0000'; // red
          }
        }

        function draw() {
          micAnalyser.getByteTimeDomainData(micDataArray);

          let sum = 0;
          for (let i = 0; i < micDataArray.length; i++) {
            sum += Math.abs(micDataArray[i] - 128);
          }
          let average = sum / micDataArray.length;
          let normalized = average / 128; // range 0–1

          micCtx.clearRect(0, 0, micCanvas.width, micCanvas.height);

          // Draw background bar
          micCtx.fillStyle = '#333';
          micCtx.fillRect(0, 0, micCanvas.width, micCanvas.height);

          // Get color based on volume
          let color = getColor(normalized);

          // Draw volume bar
          micCtx.fillStyle = color;
          micCtx.fillRect(0, 0, micCanvas.width * normalized, micCanvas.height);

          requestAnimationFrame(draw);
        }

        draw();
      } catch (err) {
        console.error('Mic error:', err);
        micStatus.textContent = 'Device not working';
        micStatus.className = 'not-working';
        micRunning = false;
      }
    });
  </script>

</body>
</html>
