<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Testing</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #141E30, #243B55);
      color: white;
      text-align: center;
      padding: 1rem;
      margin: 0;
    }

    .test-section {
      margin: 1rem auto;
      max-width: 600px;
      width: 90%;
      background: #1f2a3a;
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      box-sizing: border-box;
    }

    h2 {
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }

    canvas {
      margin-top: 0.5rem;
      border-radius: 10px;
      background: black;
      width: 100%;
      height: auto;
    }

    .button {
      padding: 10px 16px;
      font-size: 15px;
      margin-top: 0.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
    }

    .status {
      margin-top: 0.5rem;
    }

    .slider-container {
      margin-top: 0.5rem;
    }

    input[type="range"] {
      width: 100%;
      max-width: 300px;
      margin: 5px auto;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      h2 {
        font-size: 1.2rem;
      }

      .test-section {
        width: 100%;
        padding: 0.8rem;
      }

      .button {
        width: 100%;
        font-size: 16px;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="test-section" id="stressTest">
    <h2>Stress Test</h2>
    <canvas id="stressChart"></canvas>
    <div class="status" id="stressStatus">Status: --</div>
    <div class="slider-container">
      <input type="range" id="stressInput" min="0" max="100" value="0">
    </div>
    <button class="button" onclick="updateStressLevel()">Update Stress</button>
  </div>

  <div class="test-section" id="resilienceTest">
    <h2>Resilience Test</h2>
    <canvas id="resilienceChart"></canvas>
    <div class="status" id="resilienceStatus">Status: --</div>
    <div class="slider-container">
      <input type="range" id="resilienceInput" min="0" max="100" value="0">
    </div>
    <button class="button" onclick="updateResilienceLevel()">Update Resilience</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const stressCtx = document.getElementById('stressChart').getContext('2d');
    const resilienceCtx = document.getElementById('resilienceChart').getContext('2d');

    const stressChart = new Chart(stressCtx, {
      type: 'bar',
      data: {
        labels: ['Stress Level'],
        datasets: [{
          label: 'Stress',
          data: [0],
          backgroundColor: getColor(0),
        }]
      },
      options: {
        scales: {
          y: { min: 0, max: 100 }
        }
      }
    });

    const resilienceChart = new Chart(resilienceCtx, {
      type: 'bar',
      data: {
        labels: ['Resilience Level'],
        datasets: [{
          label: 'Resilience',
          data: [0],
          backgroundColor: getColor(0),
        }]
      },
      options: {
        scales: {
          y: { min: 0, max: 100 }
        }
      }
    });

    function getColor(value) {
      if (value < 33) return 'green';
      else if (value < 66) return 'yellow';
      else return 'red';
    }

    function updateStressLevel() {
      const value = document.getElementById('stressInput').value;
      stressChart.data.datasets[0].data = [value];
      stressChart.data.datasets[0].backgroundColor = [getColor(value)];
      stressChart.update();
      document.getElementById('stressStatus').innerText = `Status: ${value}`;
    }

    function updateResilienceLevel() {
      const value = document.getElementById('resilienceInput').value;
      resilienceChart.data.datasets[0].data = [value];
      resilienceChart.data.datasets[0].backgroundColor = [getColor(value)];
      resilienceChart.update();
      document.getElementById('resilienceStatus').innerText = `Status: ${value}`;
    }
  </script>
</body>
</html>
